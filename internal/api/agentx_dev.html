<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentX 联调台</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f4;--card:#fff;--text:#182b24;--muted:#65776e;--line:#dce5df;--accent:#176a49;--soft:#e9f4ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1320px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.6px;margin:0}h2{font-size:17px;margin:0 0 16px}p{margin:4px 0;color:var(--muted)}.badge{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.layout{display:grid;grid-template-columns:360px 1fr;gap:20px}.card{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:20px}.card:last-child{margin-bottom:0}label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 5px}input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%}textarea{resize:vertical;min-height:96px}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 13px;background:var(--card);color:inherit}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){filter:brightness(.96)}.row{display:flex;gap:8px;align-items:center}.row.spread{justify-content:space-between}.agent{display:block;width:100%;text-align:left;border-radius:9px;margin:8px 0;padding:12px}.agent.selected{border-color:var(--accent);background:var(--soft)}.agent strong{font-weight:600}.sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.status{font-size:12px}.online{color:#178254}.offline{color:var(--muted)}.unhealthy{color:#b36914}.output{min-height:230px;max-height:520px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 ui-monospace,SFMono-Regular,monospace;background:var(--bg);padding:18px;border-radius:8px;margin-top:18px}.notice{min-height:23px;color:var(--muted);font-size:13px;margin:8px 0}.error{color:#b33b39}.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}details{margin-top:16px}summary{cursor:pointer;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#empty{padding:20px 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px}@media(max-width:850px){main{padding:18px}.layout{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}}@media(prefers-color-scheme:dark){:root{--bg:#14201b;--card:#1b2b23;--text:#e1ece5;--muted:#9cb2a5;--line:#31483b;--accent:#237b55;--soft:#233f2e}.online{color:#79d4a0}.error{color:#ff9e98}}
</style></head><body><main>
<header><div><h1>AgentX 联调台</h1><p>发布本地智能体，通过统一中转服务发现与调用。</p></div><span id="origin" class="badge">连接中</span></header>
<details style="margin-bottom:18px"><summary>本地访问凭证</summary><div class="row" style="margin-top:10px"><input id="local-token" type="password" placeholder="本地 CSGClaw access token，不是 AgentX Token"><button id="save-token">保存并重新连接</button></div></details><div class="layout"><aside><section class="card"><h2>发布本地智能体</h2><label for="local-agent">本地智能体</label><select id="local-agent"><option value="">加载中</option></select><label for="publish-name">展示名称</label><input id="publish-name" placeholder="选择智能体后自动填入"><label for="visibility">可见范围</label><select id="visibility"><option value="public">公共</option><option value="private">仅自己</option></select><div class="foot"><button id="publish" class="primary">发布到 AgentX</button></div><div id="publish-status" class="notice" role="status"></div></section>
<section class="card"><div class="row spread"><h2>远程智能体</h2><button id="refresh">刷新</button></div><label for="scope">目录范围</label><select id="scope"><option value="accessible">全部可访问</option><option value="public">公共</option><option value="mine">我的</option></select><div id="agents"><p id="empty">暂无智能体</p></div><p class="sub">每 5 秒刷新在线状态。</p></section></aside>
<section class="card"><div class="row spread"><h2 id="target">选择远程智能体</h2><span id="target-status" class="status"></span></div><p id="description">从左侧目录选择一个在线智能体。</p><label for="prompt">发送消息</label><textarea id="prompt" placeholder="输入需要远程智能体处理的内容"></textarea><div class="foot"><button id="send" class="primary" disabled>发送请求</button><button id="cancel" disabled>取消执行</button><label class="row" style="margin:0"><input id="stream" type="checkbox" checked style="width:auto">流式返回</label><button id="disconnect" hidden>断开执行端</button><button id="reconnect" hidden>重连执行端</button></div><div id="request-status" class="notice" role="status">尚未发起请求</div><div id="output" class="output" aria-live="polite"></div><details><summary>中转记录</summary><pre id="trace"></pre></details><details><summary>连接信息</summary><pre id="info"></pre></details></section></div>
</main><script src="/agentx-dev/app.js"></script></body></html>
